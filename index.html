<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>My France Trip Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Parisienne&family=Dancing+Script:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a scrapbook travel journal. Taped title up top, France drawn as a
   baby-blue paper cutout on a dotted page (left), the place list as a stack of
   notes (right). Tapping a pin opens a postcard. */
:root {
  --paper: #f3f8ff;      /* the journal page */
  --paper-2: #e7f1fe;    /* dotted grid, list hover */
  --sea: #eaf3ff;        /* water around France */
  --land: #cfe5ff;       /* France */
  --coast: #8fc3f2;      /* coastline stroke */
  --ink: #2f3b63;        /* text, dusk navy */
  --ink-soft: #66729a;
  --accent: #5aa2e6;     /* baby blue, a step deeper */
  --accent-ink: #ffffff;
  --butter: #fff0b3;     /* washi tape, highlights */
  --blush: #ffc8dc;      /* hearts only */
  --heart: #f2769f;
  --card: #ffffff;
  --line: #d6e6fa;
  --shadow: 0 6px 18px rgba(70, 120, 190, .14);
  --display: "Parisienne", "Snell Roundhand", "Apple Chancery", cursive;
  --body: "Nunito", "Avenir Next", system-ui, sans-serif;
  --hand: "Dancing Script", "Snell Roundhand", "Bradley Hand", cursive;
  --park: #d4efe4;       /* parks in Paris */
  --river: #9ccdfb;      /* the Seine */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151d33; --paper-2: #1c2742; --sea: #18223b; --land: #26385e; --coast: #7fb4ea;
    --ink: #e7f1ff; --ink-soft: #a9b8d8; --accent: #8cc4ff; --accent-ink: #10182c;
    --butter: #5c5326; --blush: #6a3a52; --heart: #ff9bbd; --card: #1d2846; --line: #2d3d63;
    --shadow: 0 6px 18px rgba(0, 0, 0, .35); --park: #24484a; --river: #4f86c2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151d33; --paper-2: #1c2742; --sea: #18223b; --land: #26385e; --coast: #7fb4ea;
  --ink: #e7f1ff; --ink-soft: #a9b8d8; --accent: #8cc4ff; --accent-ink: #10182c;
  --butter: #5c5326; --blush: #6a3a52; --heart: #ff9bbd; --card: #1d2846; --line: #2d3d63;
  --shadow: 0 6px 18px rgba(0, 0, 0, .35); --park: #24484a; --river: #4f86c2; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  background-image: radial-gradient(var(--paper-2) 1.4px, transparent 1.5px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
}
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 48px; }

/* ---------- header ---------- */
header { display: grid; gap: 10px; margin-bottom: 22px; }
h1 {
  font-family: var(--display); font-weight: 400; font-size: clamp(42px, 7vw, 76px);
  line-height: 1.1; margin: 0; text-wrap: balance;
}
h1 .tape {
  display: inline-block; background: var(--butter); padding: 0 22px 4px 18px;
  transform: rotate(-1.5deg); border-radius: 3px;
  box-shadow: 0 2px 0 rgba(0,0,0,.04);
}
h1 .sparkle { color: var(--accent); }
.intro { font-family: var(--hand); font-weight: 500; font-size: 23px; line-height: 1.3; margin: 0; max-width: 60ch; color: var(--ink-soft); }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.stat {
  font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
  background: var(--card); border: 1.5px dashed var(--coast); color: var(--ink);
  font-variant-numeric: tabular-nums;
}

/* ---------- main layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* ---------- map ---------- */
.map-card {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px);
  background: var(--sea); border-radius: 28px; border: 2px solid var(--line);
  box-shadow: var(--shadow); overflow: hidden;
}
@media (max-width: 860px) { .map-card { position: relative; top: 0; } }
.regions { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 12px 0; }
.chip {
  font: 700 13px/1 var(--body); color: var(--ink); background: var(--card);
  border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 12px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: transform .15s, background .15s, border-color .15s;
}
.chip:hover { transform: translateY(-1px); border-color: var(--coast); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip:focus-visible, button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chip .n { font-variant-numeric: tabular-nums; opacity: .75; font-weight: 800; }

.map-stage { position: relative; aspect-ratio: 1080 / 1010; max-height: 76vh; width: 100%; touch-action: none; cursor: grab; }
.map-stage.dragging { cursor: grabbing; }
.map-stage svg { width: 100%; height: 100%; display: block; }
.land { fill: var(--land); stroke: var(--coast); stroke-width: 2.4; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.land-shadow { fill: var(--coast); opacity: .35; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: grid; gap: 6px; }
.zoom button {
  width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink); font: 800 20px/1 var(--body); cursor: pointer; box-shadow: var(--shadow);
}
.map-hint { position: absolute; left: 14px; bottom: 12px; font-family: var(--hand); font-weight: 500; font-size: 18px; color: var(--ink-soft); pointer-events: none; }

.pin { cursor: pointer; }
.pin .bubble { stroke: var(--card); }
.pin text { pointer-events: none; }
.pin .label { font-family: var(--body); font-weight: 800; fill: var(--ink); paint-order: stroke; stroke: var(--sea); stroke-linejoin: round; }
.pin:hover .bubble, .pin.on .bubble { stroke: var(--accent); }
.pin .heart-dot { fill: var(--heart); stroke: var(--card); }
.cluster .bubble { fill: var(--accent); stroke: var(--card); }
.cluster text { fill: var(--accent-ink); font-family: var(--body); font-weight: 800; }
.detail-land, .paris { display: none; }
svg.zoomed .detail-land, svg.zoomed .paris { display: inline; }
svg.zoomed .land.simple, svg.zoomed .land-shadow { display: none; }
.park { fill: var(--park); }
.river { fill: none; stroke: var(--river); stroke-linecap: round; stroke-linejoin: round; }
.arr { fill: none; stroke: var(--coast); stroke-dasharray: 4 5; vector-effect: non-scaling-stroke; stroke-width: 1.4; opacity: .8; }
.arr-label, .city-label { font-family: var(--hand); font-weight: 700; fill: var(--ink-soft); pointer-events: none; paint-order: stroke; stroke: var(--land); stroke-linejoin: round; }
.city-label { font-family: var(--display); font-weight: 400; fill: var(--ink); }
.osm { position: absolute; right: 60px; bottom: 10px; font-size: 11px; color: var(--ink-soft); pointer-events: auto; }
.osm a { color: inherit; }

/* ---------- list ---------- */
.panel { display: grid; gap: 14px; min-width: 0; }
.search {
  width: 100%; font: 600 15px var(--body); color: var(--ink); background: var(--card);
  border: 2px solid var(--line); border-radius: 999px; padding: 11px 18px;
}
.search::placeholder { color: var(--ink-soft); }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.count { font-family: var(--hand); font-weight: 700; font-size: 19px; color: var(--ink-soft); }

.city { display: grid; gap: 8px; }
.city h2 {
  font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.1; margin: 8px 0 0;
  display: flex; align-items: baseline; gap: 8px;
}
.city h2 small { font: 700 13px var(--body); color: var(--ink-soft); }
.item {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 10px 12px;
  cursor: pointer; text-align: left; color: var(--ink); font: inherit; width: 100%;
  transition: transform .15s, border-color .15s;
}
.item:hover { transform: rotate(-.4deg) translateY(-1px); border-color: var(--coast); }
.item.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.sticker {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px;
  border: 2px solid var(--card); box-shadow: 0 1px 0 var(--line);
}
.item .t { min-width: 0; }
.item .nm { font-weight: 800; overflow-wrap: anywhere; }
.item .sub { font-size: 13px; color: var(--ink-soft); }
.item .meta { display: flex; gap: 6px; align-items: center; }
.tag { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--paper-2); color: var(--ink-soft); white-space: nowrap; }
.heart-btn {
  border: 0; background: none; cursor: pointer; padding: 4px; line-height: 0; color: var(--line);
}
.heart-btn svg { width: 22px; height: 22px; }
.heart-btn[aria-pressed="true"] { color: var(--heart); }
.empty { font-family: var(--hand); font-weight: 500; font-size: 21px; color: var(--ink-soft); padding: 20px; text-align: center; background: var(--card); border-radius: 18px; border: 1.5px dashed var(--line); }

/* ---------- postcard ---------- */
.postcard-scrim { position: fixed; inset: 0; background: rgba(20, 30, 60, .25); z-index: 20; }
.postcard {
  position: fixed; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-1deg);
  width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto;
  background: var(--card); border-radius: 22px; box-shadow: 0 20px 50px rgba(30, 60, 120, .28);
  border: 2px solid var(--line); padding: 26px 22px 18px;
}
.postcard::before {  /* airmail edge */
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 8px;
  background: repeating-linear-gradient(135deg, var(--accent) 0 10px, var(--card) 10px 20px, var(--blush) 20px 30px, var(--card) 30px 40px);
}
@media (max-width: 600px) {
  .postcard { top: auto; bottom: 0; transform: translate(-50%, 0); width: 100vw; border-radius: 22px 22px 0 0;
    padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 80vh; }
}
.pc-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.pc-head h3 { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.1; margin: 4px 0 2px; text-wrap: balance; overflow-wrap: anywhere; }
.pc-where { color: var(--ink-soft); font-weight: 700; font-size: 14px; }
.stamp {
  width: 64px; height: 72px; display: grid; place-items: center; font-size: 30px;
  border: 3px dotted var(--coast); border-radius: 6px; transform: rotate(4deg); background: var(--paper);
}
.notes { display: grid; gap: 12px; margin: 16px 0; }
.note { background: var(--paper); border-radius: 14px; padding: 10px 14px; border: 1.5px solid var(--line); }
.note p { font-family: var(--hand); font-weight: 500; font-size: 20px; line-height: 1.3; margin: 0 0 6px; }
.note a { font-weight: 800; color: var(--accent); text-decoration: none; font-size: 14px; }
.note a:hover { text-decoration: underline; }
.pc-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.addr { font-size: 13px; color: var(--ink-soft); min-width: 0; flex: 1 1 200px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; font: 800 14px var(--body); text-decoration: none;
  padding: 10px 16px; border-radius: 999px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.close { position: absolute; top: 10px; right: 12px; border: 0; background: none; font-size: 24px; cursor: pointer; color: var(--ink-soft); padding: 4px 8px; }

footer { margin-top: 28px; font-family: var(--hand); font-weight: 500; font-size: 20px; color: var(--ink-soft); text-align: center; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1><span class="tape">My France Trip</span> <span class="sparkle">✦</span></h1>
    <p class="intro">I keep sending myself tiktoks about France without ever rewatching them. So I thought, "Why not make a map?"</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="layout">
    <section class="map-card" aria-label="Map of France">
      <div class="regions" id="regions"></div>
      <div class="map-stage" id="stage">
        <svg id="map" viewBox="0 0 1080 1010" role="img" aria-label="France with a pin for each saved place">
          <g id="world"></g>
          <g id="labels"></g>
          <g id="pins"></g>
        </svg>
        <div class="zoom">
          <button type="button" id="zin" aria-label="Zoom in">+</button>
          <button type="button" id="zout" aria-label="Zoom out">−</button>
        </div>
        <div class="map-hint">drag to wander · scroll to zoom</div>
        <div class="osm">map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
      </div>
    </section>

    <section class="panel" aria-label="Saved places">
      <input class="search" id="q" type="search" placeholder="Search a place, city, or what someone said…" aria-label="Search places">
      <div class="cats" id="cats"></div>
      <div class="toolbar">
        <span class="count" id="count"></span>
        <button type="button" class="chip" id="onlyHearts" aria-pressed="false">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.9 3.8 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
          Want to go
        </button>
      </div>
      <div id="list" class="panel"></div>
    </section>
  </div>

  <footer>pinned from TikToks and Google Maps links sent to Discord ♡ updated every Monday · last update Oct 19, 2026</footer>
</div>

<div class="postcard-scrim" id="scrim" hidden></div>

"tiktok"},{"note":"Pictured lit up at dusk from the Seine cruise and as a backdrop to the morning run.","url":"https://www.tiktok.com/@dineinherecontent/photo/7621989474699873550","by":"dineinherecontent","src":"tiktok"},{"note":"Free to see from outside; stairs to the 2nd floor cost €14.80 and the summit by lift €36.70, so book online in advance. It sparkles every hour on the hour after sunset until 11PM, for 5 minutes each time.","url":"https://www.tiktok.com/@haley.tran_/photo/7681345641313881362","by":"haley.tran_","src":"tiktok"}]},{"name":"Carette","city":"Paris","cat":"bakery","x":536.04,"y":243.63,"addr":"4 Pl. du Trocadéro et du 11 Novembre, 75016 Paris","maps":"https://maps.google.com/?cid=15708912606735799609&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","added":"2026-10-10","m":[{"note":"Their first stop after arriving in Paris. It was totally worth waiting in the line.","url":"https://www.tiktok.com/@madyvivian/video/7683922301603073293","by":"Mady Vivian🌻","src":"tiktok"}]},{"name":"Louvre Museum","city":"Paris","cat":"museum","x":539.51,"y":243.94,"addr":"75001 Paris","maps":"https://maps.google.com/?cid=13363865620386383060&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","added":"2026-10-10","m":[{"note":"There's so much to see that they got lost inside. Plan about four hours here.","url":"https://www.tiktok.com/@madyvivian/video/7683922301603073293","by":"Mady Vivian🌻","src":"tiktok"},{"note":"'Seriously you can't skip the Louvre.' The Richelieu wing is the best, and Canova's Psyche and Cupid is also pictured.","url":"https://www.tiktok.com/@dineinherecontent/photo/7621989474699873550","by":"dineinherecontent","src":"tiktok"},{"note":"Tickets are €32 for non-EU visitors after a price rise in Jan 2026. Entry is free every 1st Saturday of the month from 6PM, but it gets busy.","url":"https://www.tiktok.com/@haley.tran_/photo/7681345641313881362","by":"haley.tran_","src":"tiktok"}]},{"name":"Les Caves du Louvre","city":"Paris","cat":"bar","x":539.85,"y":243.9,"addr":"52 Rue de l'Arbre Sec, 75001 Paris","maps":"https://maps.google.com/?cid=8998956292772069516&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","added":"2026-10-10","m":[{"note":"A private wine tasting tour in the former wine cellars of the Louvre, a few blocks from the museum.","url":"https://www.tiktok.com/@madyvivian/video/7683922301603073293","by":"Mady Vivian🌻","src":"tiktok"}]},{"name":"Notre-Dame de Paris","city":"Paris","cat":"sight","x":540.35,"y":244.7,"addr":"6 Parvis Notre-Dame - Pl. Jean-Paul II, 75004 Paris","maps":"https://maps.google.com/?cid=3909157082539624077&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","added":"2026-10-10","m":[{"note":"They took a tour of the bell towers, which was described as insane.","url":"https://www.tiktok.com/@madyvivian/video/7683922301603073293","by":"Mady Vivian🌻","src":"tiktok"}]},{"name":"Sainte-Chapelle","city":"Paris","cat":"sight","x":540.01,"y":244.46,"addr":"10 Bd du Palais, 75001 Paris","maps":"https://maps.google.com/?cid=3743689731647743848&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","added":"2026-10-10","m":[{"note":"Visited right after Notre-Dame and described as breathtaking.","url":"https://www.tiktok.com/@madyvivian/video/7683922301603073293","by":"Mady Vivian🌻","src":"tiktok"}]},{"name":"Palace of Versailles","city":"Versailles","cat":"sight","x":524.55,"y":249.51,"addr":"Place d'Armes, 78000 Versailles","maps":"https://maps.google.com/?cid=376328476344045199&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","added":"2026-10-10","m":[{"note":"A day trip by train from Paris that was very worth it for the palace.","url":"https://www.tiktok.com/@madyvivian/video/7683922301603073293","by":"Mady Vivian🌻","src":"tiktok"},{"note":"Tickets for non-EEA visitors are €25 in low season (Nov–Mar) and €35 in high season (Apr–Oct).","url":"https://www.tiktok.com/@haley.tran_/photo/7681345641313881362","by":"haley.tran_","src":"tiktok"}]},{"name":"Gardens of Versailles","city":"Versailles","cat":"nature","x":524.27,"y":249.41,"addr":"Place d'Armes, 78000 Versailles","maps":"https://maps.google.com/?cid=8836053835576518477&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","added":"2026-10-10","m":[{"note":"They toured the gardens by golf cart, which was a lot of fun.","url":"https://www.tiktok.com/@madyvivian/video/7683922301603073293","by":"Mady Vivian🌻","src":"tiktok"}]},{"name":"Nice","city":"Nice","cat":"town","x":878.47,"y":758.98,"addr":"Nice","maps":"https://maps.google.com/?cid=290510376680266352&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","added":"2026-10-10","m":[{"note":"Used as the base for the whole week. Trains from Nice reach most of the French Riviera easily.","url":"https://www.tiktok.com/@laur.lately/video/7678037175698509063","by":"laur.lately","src":"tiktok"},{"note":"The French Riviera town the video's top 10 list is about, recommended for a fall trip or next year's getaway.","url":"https://www.tiktok.com/@thetraveldispatch/video/7551549568345820430","by":"The Travel Dispatch","src":"tiktok"},{"note":"The starting point for the day trip to Villefranche-sur-Mer by train or bus.","url":"https://www.tiktok.com/@insponicois/video/7671977458156965152","by":"Marie | Côte d’Azur Diaries 🍋","src":"tiktok"},{"note":"Recommended as the best home base on the Riviera: the biggest city, with the most restaurants, beaches and nightlife, easy to explore without a car, and well placed for day trips. The creator says Nice deserves more credit and the sea is insanely blue.","url":"https://www.tiktok.com/@silkatlas/photo/7685404242173103382","by":"silkatlas","src":"tiktok"}]},{"name":"Vieux Nice (Old Town)","city":"Nice","cat":"neighborhood","x":879.55,"y":760.28,"addr":"old nice, Nice","maps":"https://maps.google.com/?cid=16648179206094447467&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","added":"2026-10-10","m":[{"note":"Where they stayed all week and called it one of their best decisions. It's central to restaurants and bars, with picturesque narrow streets and little cafés.","url":"https://www.tiktok.com/@laur.lately/video/7678037175698509063","by":"laur.lately","src":"tiktok"},{"note":"Exploring Old Town and hopping between its shops for local provisions is one of the creator's favorite experiences.","url":"https://www.tiktok.com/@thetraveldispatch/video/7551549568345820430","by":"The Travel Dispatch","src":"tiktok"},{"note":"Nice's Old Town, where the video recommends browsing the flea market.","url":"https://www.tiktok.com/@movingwithmax/photo/7665298250240363794","by":"movingwithmax","src":"tiktok"}]},{"name":"Gare de Nice-Ville","city":"Nice","cat":"other","x":878.47,"y":759.54,"addr":"Av. Thiers, 06008 Nice","maps":"https://maps.google.com/?cid=8077662411355496661&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","added":"2026-10-10","m":[{"note":"Nice's main train station, used for day trips. It's a little far from the Old Town.","url":"https://www.tiktok.com/@laur.lately/video/7678037175698509063","by":"laur.lately","src":"tiktok"}]},{"name":"Promenade des Anglais","city":"Nice","cat":"sight","x":878.88,"y":760.5,"addr":"Prom. des Anglais, Nice","maps":"https://maps.google.com/?cid=14591229212742811375&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","added":"2026-10-10","m":[{"note":"They started their first full day in Nice walking along the seafront promenade and seeing the beach clubs.","url":"https://www.tiktok.com/@laur.lately/video/7678037175698509063","by":"laur.lately","src":"tiktok"}]},{"name":"Hobo Coffee","city":"Nice","cat":"cafe","x":879.44,"y":760.32,"addr":"5 Bis Rue Sainte-Reparate, 06300 Nice","maps":"https://maps.google.com/?cid=17684240146085585174&g_mp=Cidnb29nbGUubWFwcy5wbGFjZXMudjEuUGxhY2VzLlNlYXJjaFRleHQQAhgEIAA","added":"2026-10-10","m":[{"note"   let hearts = new Set();
  try { hearts = new Set(JSON.parse(localStorage.getItem(HKEY) || "[]")); } catch (e) {}
  const saveHearts = () => { try { localStorage.setItem(HKEY, JSON.stringify([...hearts])); } catch (e) {} };
  const key = p => p.name + "|" + p.city;

  // ---------- regions ----------
  const inBox = (p, x0, x1, y0, y1) => p.x >= x0 && p.x <= x1 && p.y >= y0 && p.y <= y1;
  const REGIONS = [
    { id: "all", label: "All of France", test: () => true, box: [0, 0, 1080, 1010] },
    { id: "paris", label: "Paris & around", test: p => inBox(p, 500, 590, 215, 275) },
    { id: "riviera", label: "Côte d'Azur", test: p => inBox(p, 840, 920, 735, 785) },
  ];
  REGIONS.push({ id: "else", label: "Elsewhere", test: p => !REGIONS.slice(1, 3).some(r => r.test(p)) });
  function regionBox(r) {
    if (r.box) return r.box;
    const ps = PLACES.filter(r.test);
    if (!ps.length) return [0, 0, 1080, 1010];
    let x0 = Math.min(...ps.map(p => p.x)), x1 = Math.max(...ps.map(p => p.x));
    let y0 = Math.min(...ps.map(p => p.y)), y1 = Math.max(...ps.map(p => p.y));
    const pad = Math.max(8, (x1 - x0) * .18, (y1 - y0) * .18);
    return fitAspect([x0 - pad, y0 - pad, x1 - x0 + 2 * pad, y1 - y0 + 2 * pad]);
  }

  // ---------- map view ----------
  const svg = document.getElementById("map"), stage = document.getElementById("stage");
  const ASPECT = 1080 / 1010;
  let view = [0, 0, 1080, 1010];
  function fitAspect([x, y, w, h]) {
    if (w / h > ASPECT) { const nh = w / ASPECT; return [x, y - (nh - h) / 2, w, nh]; }
    const nw = h * ASPECT; return [x - (nw - w) / 2, y, nw, h];
  }
  function clampView([x, y, w, h]) {
    w = Math.min(Math.max(w, 2.5), 1300); h = w / ASPECT;
    x = Math.min(Math.max(x, -200), 1080 + 200 - w); y = Math.min(Math.max(y, -200), 1010 + 200 - h);
    return [x, y, w, h];
  }
  let anim = null;
  function setView(v, animate = true) {
    v = clampView(v);
    cancelAnimationFrame(anim);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!animate || reduce) { view = v; drawView(); return; }
    const from = view.slice(), t0 = performance.now(), dur = 420;
    const step = t => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      view = from.map((a, i) => a + (v[i] - a) * e); drawView();
      if (k < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  }
  function drawView() { svg.setAttribute("viewBox", view.join(" ")); svg.classList.toggle("zoomed", view[2] < 260); renderPins(); }

  // land
  document.getElementById("world").innerHTML =
    `<path class="land-shadow" d="${DATA.path}" transform="translate(5 7)"/><path class="land simple" d="${DATA.path}"/>` +
    `<path class="land detail-land" d="${DATA.detail}"/>` +
    `<g class="paris">${DATA.parks.map(p => `<path class="park" d="${p.d}"><title>${esc(p.n)}</title></path>`).join("")}` +
    `<path class="river" d="${DATA.river}" stroke-width=".16"/>` +
    `${DATA.arr.map(a => `<path class="arr" d="${a.d}"/>`).join("")}</g>`;
  const CITY_POS = {};
  PLACES.forEach(p => { const c = CITY_POS[p.city] ||= { x: 0, y: 0, n: 0 }; c.x += p.x; c.y += p.y; c.n++; });
  Object.values(CITY_POS).forEach(c => { c.x /= c.n; c.y /= c.n; });
  if (CITY_POS.Paris) Object.assign(CITY_POS.Paris, { x: 545.0, y: 244.4 });  // Île de la Cité, not the average
  const labelsG = document.getElementById("labels");
  // Greedy label placement: skip any label whose box would overlap one already placed.
  function placer() {
    const boxes = [];
    return (x, y, text, fs) => {
      const w = text.length * fs * .55, b = [x - w / 2, y - fs, x + w / 2, y + fs * .3];
      if (boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1])) return false;
      boxes.push(b); return true;
    };
  }
  function renderLabels(R) {
    const w = view[2]; let html = "";
    if (w < 30) {
      html = DATA.arr.map(a => `<text class="arr-label" x="${a.x}" y="${a.y}" font-size="${R * .9}" stroke-width="${R * .35}" text-anchor="middle" dominant-baseline="central">${a.l}</text>`).join("");
    } else if (w < 420) {
      const fits = placer();
      html = Object.entries(CITY_POS).sort((a, b) => b[1].n - a[1].n)
        .filter(([name, c]) => fits(c.x, c.y - R * 2.1, name, R * 1.5))
        .map(([name, c]) => `<text class="city-label" x="${c.x}" y="${c.y - R * 2.1}" font-size="${R * 1.5}" stroke-width="${R * .4}" text-anchor="middle">${esc(name)}</text>`).join("");
    }
    labelsG.innerHTML = html;
  }

  // ---------- filters ----------
  const state = { q: "", cats: new Set(), region: "all", onlyHearts: false, sel: null };
  function visible() {
    const q = state.q.trim().toLowerCase();
    const r = REGIONS.find(r => r.id === state.region);
    return PLACES.filter(p =>
      (!state.cats.size || state.cats.has(p.cat)) &&
      r.test(p) &&
      (!state.onlyHearts || hearts.has(key(p))) &&
      (!q || [p.name, p.city, CATS[p.cat]?.label, ...p.m.map(m => m.note + " " + m.by)].join(" ").toLowerCase().includes(q))
    );
  }

  // ---------- pins (clustered in screen space) ----------
  const pinsG = document.getElementById("pins");
  function renderPins() {
    const ps = visible();
    const pxPerUnit = (stage.clientWidth || 600) / view[2];
    const R = 15 / pxPerUnit;            // pin radius: ~15px on screen at any zoom
    const showLabels = pxPerUnit > 40;    // place names appear once you're in the streets
    renderLabels(R);
    // greedy clustering
    const groups = [];
    for (const p of ps) {
      const g = groups.find(g => Math.hypot(g.x - p.x, g.y - p.y) < R * 1.6);
      if (g) { g.items.push(p); g.x = (g.x * (g.items.length - 1) + p.x) / g.items.length; g.y = (g.y * (g.items.length - 1) + p.y) / g.items.length; }
      else groups.push({ x: p.x, y: p.y, items: [p] });
    }
    let html = "";
    const fits = placer();
    for (const g of groups) {
      if (g.items.length > 1) {
        const r = R * (1.05 + Math.min(.6, g.items.length / 40));
        html += `<g class="cluster pin" data-cluster="${g.items.map(p => p.id).join(",")}" tabindex="0" role="button" aria-label="${g.items.length} places here, zoom in">
          <circle class="bubble" cx="${g.x}" cy="${g.y}" r="${r}" stroke-width="${R * .18}"/>
          <text x="${g.x}" y="${g.y}" font-size="${R * .95}" text-anchor="middle" dominant-baseline="central">${g.items.length}</text></g>`;
      } else {
        const p = g.items[0], c = CATS[p.cat] || CATS.other, on = state.sel === p.id;
        html += `<g class="pin${on ? " on" : ""}" data-id="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)}, ${esc(p.city)}">
          <circle class="bubble" cx="${p.x}" cy="${p.y}" r="${R * (on ? 1.2 : 1)}" fill="${c.color}" stroke-width="${R * .2}"/>
          <text x="${p.x}" y="${p.y + R * .05}" font-size="${R * 1.05}" text-anchor="middle" dominant-baseline="central">${c.emoji}</text>
          ${hearts.has(key(p)) ? `<circle class="heart-dot" cx="${p.x + R * .75}" cy="${p.y - R * .75}" r="${R * .32}" stroke-width="${R * .1}"/>` : ""}
          ${showLabels && fits(p.x, p.y + R * 1.9, p.name, R * .72) ? `<text class="label" x="${p.x}" y="${p.y + R * 1.9}" font-size="${R * .72}" stroke-width="${R * .3}" text-anchor="middle">${esc(p.name)}</text>` : ""}
        </g>`;
      }
    }
    pinsG.innerHTML = html;
  }
  function activatePin(el) {
    if (el.dataset.cluster) {
      const ids = el.dataset.cluster.split(",").map(Number), ps = ids.map(i => PLACES[i]);
      let x0 = Math.min(...ps.map(p => p.x)), x1 = Math.max(...ps.map(p => p.x));
      let y0 = Math.min(...ps.map(p => p.y)), y1 = Math.max(...ps.map(p => p.y));
      const pad = Math.max(3, (x1 - x0) * .25, (y1 - y0) * .25);
      const target = fitAspect([x0 - pad, y0 - pad, x1 - x0 + 2 * pad, y1 - y0 + 2 * pad]);
      if (target[2] > view[2] * .8) target[2] = view[2] * .4, target[3] = target[2] / ASPECT, target[0] = (x0 + x1) / 2 - target[2] / 2, target[1] = (y0 + y1) / 2 - target[3] / 2;
      setView(target);
    } else openCard(Number(el.dataset.id));
  }
  pinsG.addEventListener("click", e => { const el = e.target.closest(".pin"); if (el && !moved) activatePin(el); });
  pinsG.addEventListener("keydown", e => { const el = e.target.closest(".pin"); if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); activatePin(el); } });

  // ---------- pan / zoom ----------
  let drag = null, moved = false;
  stage.addEventListener("pointerdown", e => {
    if (e.target.closest(".zoom")) return;
    drag = { x: e.clientX, y: e.clientY, v: view.slice(), id: e.pointerId }; moved = false;
  });
  stage.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    if (!moved) { moved = true; stage.classList.add("dragging"); try { stage.setPointerCapture(drag.id); } catch (_) {} }
    const k = drag.v[2] / stage.clientWidth;
    view = clampView([drag.v[0] - dx * k, drag.v[1] - dy * k, drag.v[2], drag.v[3]]); drawView();
  });
  const endDrag = () => { drag = null; stage.classList.remove("dragging"); setTimeout(() => moved = false, 0); };
  stage.addEventListener("pointerup", endDrag); stage.addEventListener("pointercancel", endDrag);
  function zoomAt(f, cx = .5, cy = .5) {
    const [x, y, w, h] = view, nw = w * f, nh = h * f;
    setView([x + (w - nw) * cx, y + (h - nh) * cy, nw, nh], false);
  }
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(Math.exp(e.deltaY * .0015), (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
  }, { passive: false });
  document.getElementById("zin").onclick = () => { const [x, y, w, h] = view; setView([x + w * .2, y + h * .2, w * .6, h * .6]); };
  document.getElementById("zout").onclick = () => { const [x, y, w, h] = view; setView([x - w * .33, y - h * .33, w * 1.66, h * 1.66]); };
  new ResizeObserver(() => renderPins()).observe(stage);

  // ---------- chips ----------
  const regionsEl = document.getElementById("regions");
  regionsEl.innerHTML = REGIONS.map(r => `<button type="button" class="chip" data-region="${r.id}" aria-pressed="${r.id === state.region}">${esc(r.label)} <span class="n">${PLACES.filter(r.test).length}</span></button>`).join("");
  regionsEl.addEventListener("click", e => {
    const b = e.target.closest("[data-region]"); if (!b) return;
    state.region = b.dataset.region;
    regionsEl.querySelectorAll("[data-region]").forEach(x => x.setAttribute("aria-pressed", x === b));
    setView(state.region === "else" ? [0, 0, 1080, 1010] : regionBox(REGIONS.find(r => r.id === state.region)));
    renderList();
  });

  const catsEl = document.getElementById("cats");
  const catCounts = {}; PLACES.forEach(p => catCounts[p.cat] = (catCounts[p.cat] || 0) + 1);
  catsEl.innerHTML = Object.entries(CATS).filter(([k]) => catCounts[k]).sort((a, b) => catCounts[b[0]] - catCounts[a[0]])
    .map(([k, c]) => `<button type="button" class="chip" data-cat="${k}" aria-pressed="false"><span aria-hidden="true">${c.emoji}</span>${c.label} <span class="n">${catCounts[k]}</span></button>`).join("");
  catsEl.addEventListener("click", e => {
    const b = e.target.closest("[data-cat]"); if (!b) return;
    const k = b.dataset.cat;
    state.cats.has(k) ? state.cats.delete(k) : state.cats.add(k);
    b.setAttribute("aria-pressed", state.cats.has(k));
    renderList(); renderPins();
  });
  const onlyHeartsBtn = document.getElementById("onlyHearts");
  onlyHeartsBtn.onclick = () => { state.onlyHearts = !state.onlyHearts; onlyHeartsBtn.setAttribute("aria-pressed", state.onlyHearts); renderList(); renderPins(); };
  document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; renderList(); renderPins(); });

  // ---------- stats ----------
  const cities = new Set(PLACES.map(p => p.city)), posts = new Set(PLACES.flatMap(p => p.m.map(m => m.url)));
  document.getElementById("stats").innerHTML =
    `<span class="stat">${PLACES.length} places</span><span class="stat">${cities.size} towns &amp; cities</span><span class="stat">${posts.size} posts &amp; links</span>`;

  // ---------- list ----------
  const listEl = document.getElementById("list"), countEl = document.getElementById("count");
  function renderList() {
    const ps = visible();
    countEl.textContent = ps.length === PLACES.length ? `all ${ps.length} places` : `${ps.length} of ${PLACES.length} places`;
    if (!ps.length) {
      listEl.innerHTML = `<div class="empty">${state.onlyHearts && !hearts.size ? "Tap the heart on a place to save it here ♡" : "Nothing matches that. Try another word or clear a filter."}</div>`;
      return;
    }
    const byCity = {};
    ps.forEach(p => (byCity[p.city || "Somewhere in France"] ||= []).push(p));
    listEl.innerHTML = Object.entries(byCity).sort((a, b) => b[1].length - a[1].length).map(([city, items]) => `
      <div class="city">
        <h2>${esc(city)} <small>${items.length}</small></h2>
        ${items.map(p => {
          const c = CATS[p.cat] || CATS.other;
          return `<div class="item${state.sel === p.id ? " on" : ""}" data-id="${p.id}" role="button" tabindex="0">
            <span class="sticker" style="background:${c.color}" aria-hidden="true">${c.emoji}</span>
            <span class="t"><span class="nm">${esc(p.name)}</span><br><span class="sub">${esc(c.label)}${p.m.length > 1 ? ` · in ${p.m.length} posts` : ""}</span></span>
            <span class="meta"><button type="button" class="heart-btn" data-heart="${p.id}" aria-pressed="${hearts.has(key(p))}" aria-label="Want to go to ${esc(p.name)}">${HEART}</button></span>
          </div>`;
        }).join("")}
      </div>`).join("");
  }
  function toggleHeart(id) {
    const k = key(PLACES[id]);
    hearts.has(k) ? hearts.delete(k) : hearts.add(k); saveHearts();
    renderList(); renderPins(); if (!postcard.hidden) openCard(id, false);
  }
  listEl.addEventListener("click", e => {
    const h = e.target.closest("[data-heart]"); if (h) { e.stopPropagation(); toggleHeart(Number(h.dataset.heart)); return; }
    const it = e.target.closest(".item"); if (it) openCard(Number(it.dataset.id));
  });
  listEl.addEventListener("keydown", e => { const it = e.target.closest(".item"); if (it && e.target === it && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openCard(Number(it.dataset.id)); } });

  // ---------- postcard ----------
  const postcard = document.getElementById("postcard"), scrim = document.getElementById("scrim");
  let lastFocus = null;
  function openCard(id, fly = true) {
    const p = PLACES[id], c = CATS[p.cat] || CATS.other;
    state.sel = id;
    if (fly) { lastFocus = document.activeElement; const w = Math.min(view[2], 12); setView(fitAspect([p.x - w / 2, p.y - w / 2 / ASPECT, w, w / ASPECT])); }
    postcard.innerHTML = `
      <button type="button" class="close" id="pcClose" aria-label="Close">×</button>
      <div class="pc-head">
        <div>
          <span class="tag">${esc(c.label)}</span>
          <h3 id="pcName">${esc(p.name)}</h3>
          <div class="pc-where">${esc(p.city)}</div>
        </div>
        <div class="stamp" style="background:${c.color}" aria-hidden="true">${c.emoji}</div>
      </div>
      <div class="notes">
        ${p.m.map(m => `<div class="note">
          <p>${esc(m.note || "Saved for later.")}</p>
          <a href="${esc(m.url)}" target="_blank" rel="noopener">${m.src === "google_maps" ? `Google Maps link shared by ${esc(m.by)}` : `Watch the TikTok · @${esc(m.by)}`} ↗</a>
        </div>`).join("")}
      </div>
      <div class="pc-foot">
        <span class="addr">${esc(p.addr)}</span>
        <button type="button" class="btn ghost" data-heart="${id}" aria-pressed="${hearts.has(key(p))}">${hearts.has(key(p)) ? "♥ Saved" : "♡ Want to go"}</button>
        ${p.maps ? `<a class="btn" href="${esc(p.maps)}" target="_blank" rel="noopener">Open in Google Maps ↗</a>` : ""}
      </div>`;
    postcard.hidden = false; scrim.hidden = false;
    document.getElementById("pcClose").focus();
    renderList(); renderPins();
  }
  function closeCard() {
    postcard.hidden = true; scrim.hidden = true; state.sel = null;
    renderList(); renderPins(); lastFocus?.focus?.();
  }
  postcard.addEventListener("click", e => {
    if (e.target.closest("#pcClose")) return closeCard();
    const h = e.target.closest("[data-heart]"); if (h) toggleHeart(Number(h.dataset.heart));
  });
  scrim.addEventListener("click", closeCard);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !postcard.hidden) closeCard(); });

  renderList(); drawView();
})();
</script>

</html>
